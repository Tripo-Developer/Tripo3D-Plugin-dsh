# Bundle layer for tripo-dsh: inserts one host row. The plugin registers the
# bundled skills (tripo-3d, tripo-game-asset) on the global skills registry, so
# every agent preset can see them.
#
# The row references the package name rather than a relative path, so Node
# resolution finds the installed code in the profile's node_modules. Users can
# override or disable the row by id in their profile's own cordis.patch.yml.
- insert:
    - id: tripo-3d
      name: 'tripo-dsh'
