# Validates plugin/ on every push to master, every pull request and every v* tag, and
# publishes it to npm (tripo-dsh) when a v* tag is pushed. Publishing uses npm trusted
# publishing (OIDC): no NPM_TOKEN is needed, and npm attaches provenance automatically.
#
# One-time prerequisite: the package was first published by hand (0.1.0), and a maintainer
# bound this repository and this workflow file name (publish.yml) under npmjs.com package
# Settings -> Trusted Publisher; otherwise the publish job fails with 401. Keep the file name.
#
# Release: push a v<version> tag whose <version> equals plugin/package.json "version".
name: Validate and publish

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Validate plugin
        run: node scripts/validate.mjs

      - name: List package contents
        working-directory: plugin
        run: npm pack --dry-run

  publish:
    needs: validate
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Trusted publishing requires npm >= 11.5.1.
      - run: npm install -g npm@^11.5.1 && npm --version

      - name: Check tag matches package.json version
        run: |
          pkg_version=$(node -p "require('./plugin/package.json').version")
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$pkg_version" != "$tag_version" ]; then
            echo "tag v$tag_version does not match plugin/package.json version $pkg_version" >&2
            exit 1
          fi

      - name: Publish
        working-directory: plugin
        run: npm publish
