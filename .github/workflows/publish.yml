# Validates plugin/ on every push to master, every pull request and every release tag, and
# publishes it to npm (@vastai/tripo-dsh) when a release tag is pushed. Publishing uses npm
# trusted publishing (OIDC): no NPM_TOKEN is needed, and npm attaches provenance automatically.
#
# One-time prerequisite: the package was created by hand as a 0.0.0 placeholder, and a
# maintainer bound this repository and this workflow file name (publish.yml) with
# `npm trust github`, allowing npm publish; otherwise the publish job fails with 401.
# The binding must complete its first successful publish within two days. Keep the file name.
#
# Release: push tripo-dsh-v<version> or v<version>, matching plugin/package.json "version".
name: Validate and publish

on:
  push:
    branches: [master]
    tags: ['v*', 'tripo-dsh-v*']
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm ci && npm run build:workspace

      - name: Validate plugin
        run: |
          node --test scripts/*.test.mjs
          node scripts/validate.mjs

      - name: List package contents
        working-directory: plugin
        run: npm pack --dry-run

  publish:
    needs: validate
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/tripo-dsh-v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Trusted publishing requires npm >= 11.5.1.
      - run: npm install -g npm@^11.5.1 && npm --version

      - name: Check tag matches package.json version
        run: |
          pkg_version=$(node -p "require('./plugin/package.json').version")
          case "${GITHUB_REF_NAME:-}" in
            tripo-dsh-v*) tag_version="${GITHUB_REF_NAME#tripo-dsh-v}" ;;
            v*) tag_version="${GITHUB_REF_NAME#v}" ;;
            *) echo "unrecognized release tag: ${GITHUB_REF_NAME:-}" >&2; exit 1 ;;
          esac
          if [ "$pkg_version" != "$tag_version" ]; then
            echo "tag $GITHUB_REF_NAME does not match plugin/package.json version $pkg_version" >&2
            exit 1
          fi

      - run: npm ci && npm run build:workspace

      - name: Publish
        working-directory: plugin
        run: npm publish
